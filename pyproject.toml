[project]
name = "kestrel-feature-parametric-self"
version = "0.4.0"
description = "Owned parametric self for Kestrel Sovereign agents — a per-agent local model nightly-finetuned on the agent's own experience"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.15"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    # The governed assertion-corpus capability (#2817) and the immutable
    # dual-backend served-adapter envelope (#2834/#2835) both ship in core
    # 0.50.0, so the temporary git pin on the reviewed commit is now replaced by
    # the released version it was waiting for — as its own note instructed. This
    # is a hard safety contract: older hosts must not fall back to direct
    # factual reads. A direct git reference also cannot be uploaded to PyPI, so
    # this floor is a precondition of publishing at all.
    "kestrel-sovereign>=0.50.0,<1",
    "kestrel-sovereign-sdk>=0.14.1,<1",
    # NB: the MLX LoRA trainer's runtime (mlx-lm) is an OPTIONAL extra, not a
    # hard dependency — see [project.optional-dependencies].local below.
    # NB: the corpus builder reads reflection's plaintext output tables directly
    # (loose coupling, no import), so kestrel-feature-reflection is an *optional*
    # runtime companion (see component.yaml), not a hard dependency.
]

[project.optional-dependencies]
# Local LoRA training runtime. Optional because the code already treats it as
# optional: ``LocalMLXAdapter._mlx_available()`` swallows every import/init
# failure and reports "trainer unavailable", and training is launched as a
# SUBPROCESS (``sys.executable -m mlx_lm lora``) rather than imported. Declaring
# it as a hard dependency made every host that merely loads this feature install
# an Apple-Silicon ML stack — mlx, mlx-lm, mlx-metal, sentencepiece, and an
# unconditional transformers — whether or not it ever trains.
#
# The platform marker is kept so ``[local]`` is a harmless no-op off arm64 macOS
# rather than an install error.
local = [
    "mlx-lm>=0.31; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.1.0",
    "pytest-timeout>=2.3.1",
]

[project.entry-points."kestrel_sovereign.features"]
ParametricSelfFeature = "kestrel_feature_parametric_self:ParametricSelfFeature"

[project.scripts]
parametric-self-release-evidence = "kestrel_feature_parametric_self.release_evidence:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kestrel_feature_parametric_self"]

[tool.hatch.metadata]
# The pre-release governed-corpus host is deliberately pinned to its reviewed
# source commit until the coordinated core release publishes a version floor.
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
