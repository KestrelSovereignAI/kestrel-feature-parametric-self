[project]
name = "kestrel-feature-parametric-self"
version = "0.3.1"
description = "Owned parametric self for Kestrel Sovereign agents — a per-agent local model nightly-finetuned on the agent's own experience"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.15"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    # The governed assertion-corpus capability is post-0.49.5 and has not yet
    # been released to PyPI. Pin the reviewed core commit instead of claiming a
    # released version provides it. Replace this source pin with the first
    # released core version containing #2817 during the coordinated release.
    # This is a hard safety contract: older hosts must not fall back to direct
    # factual reads.
    # #2753 supplies the immutable external-adapter gate catalog, signed
    # execution envelope, and correlated erasure drill contract used below.
    "kestrel-sovereign @ git+https://github.com/KestrelSovereignAI/kestrel-sovereign.git@759906be213d20948fe95c950bb8fded0ee155cf",
    "kestrel-sovereign-sdk>=0.14.1,<1",
    # The MLX LoRA trainer is Apple-Silicon only and imported lazily, so it is
    # platform-gated: it installs on arm64 macOS and is simply absent elsewhere
    # (LocalMLXAdapter.is_available() returns False, no blind fallback). This
    # keeps Linux installs and CI green without a darwin-only wheel.
    "mlx-lm>=0.31; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # NB: the corpus builder reads reflection's plaintext output tables directly
    # (loose coupling, no import), so kestrel-feature-reflection is an *optional*
    # runtime companion (see component.yaml), not a hard dependency.
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.1.0",
    "pytest-timeout>=2.3.1",
]

[project.entry-points."kestrel_sovereign.features"]
ParametricSelfFeature = "kestrel_feature_parametric_self:ParametricSelfFeature"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kestrel_feature_parametric_self"]

[tool.hatch.metadata]
# The pre-release governed-corpus host is deliberately pinned to its reviewed
# source commit until the coordinated core release publishes a version floor.
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
